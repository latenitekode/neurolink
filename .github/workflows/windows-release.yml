name: Build and release Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install icon build dependencies
        run: |
          python -m pip install Pillow
          go install github.com/akavel/rsrc@latest

      - name: Generate and embed Windows icon
        shell: pwsh
        run: |
          python assets/make_icon.py
          & "$(go env GOPATH)\\bin\\rsrc.exe" -ico assets/neurolink.ico -o rsrc.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        run: go test ./...

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w" -o dist/neurolink.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/neurolink.exe -DestinationPath dist/neurolink-windows-amd64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurolink-windows-amd64
          path: |
            dist/neurolink.exe
            dist/neurolink-windows-amd64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/neurolink.exe dist/neurolink-windows-amd64.zip --title "Neurolink ${{ github.ref_name }}" --generate-notes --verify-tag
